name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Python AST validation — pure stdlib, no installs needed.
  #    Mirrors `.claude/commands/test-all.md` step 2.
  python-ast:
    name: Python AST validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: compileall (api/, data/, scripts/)
        run: python -m compileall -q api data scripts

  # 2) TypeScript type-check — web/ (Next.js) and infra-cdk/ (CDK).
  #    Mirrors `.claude/commands/test-all.md` step 1 + ARM64 platform pin
  #    note in `infra-cdk/CLAUDE.md`.
  tsc-check:
    name: TypeScript type-check (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [web, infra-cdk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - name: npm ci
        working-directory: ${{ matrix.workspace }}
        run: npm ci
      - name: tsc --noEmit
        working-directory: ${{ matrix.workspace }}
        run: npx tsc --noEmit

  # 3) CDK synth — verifies infrastructure code compiles + synthesizes.
  #    Uses dummy account/region so no AWS credentials needed.
  cdk-synth:
    name: CDK synth (all stacks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra-cdk/package-lock.json
      - name: npm ci
        working-directory: infra-cdk
        run: npm ci
      - name: cdk synth
        working-directory: infra-cdk
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'
          CDK_DEFAULT_REGION: 'ap-northeast-2'
        run: npx cdk synth --quiet --all
      - name: jest snapshot tests
        working-directory: infra-cdk
        run: npx jest --ci

  # 4) pytest — Python unit + integration tests.
  #    Lives in tests/. Currently a smoke test that verifies api modules
  #    import cleanly; richer tests land via the tests/api/ work.
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            requirements-dev.txt
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r requirements-dev.txt
      - name: run pytest
        run: pytest tests -q
